<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Portal Photos &mdash; Lowery Landworks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e2a1f; color: #f3ead3; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 20px 16px 8px; text-align: center; position: sticky; top: 0; background: #0e2a1f; z-index: 10; border-bottom: 1px solid #1d4a35; }
  header h1 { font-size: 19px; letter-spacing: 1px; color: #d4af5a; }
  header p { margin-top: 4px; font-size: 13px; opacity: .8; }
  .bar { display: flex; gap: 8px; justify-content: center; margin-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  button { font-family: inherit; }
  .btn { background: #d4af5a; color: #0e2a1f; border: none; font-weight: 700; font-size: 15px; padding: 12px 22px; border-radius: 10px; cursor: pointer; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.ghost { background: transparent; color: #d4af5a; border: 1px solid #d4af5a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 14px; max-width: 1200px; margin: 0 auto; }
  .card { background: #123526; border: 2px solid #1d4a35; border-radius: 8px; overflow: hidden; position: relative; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card .num { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.68); color: #d4af5a; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
  .card .ctl { display: flex; border-top: 1px solid #1d4a35; }
  .card .ctl button { flex: 1; background: none; border: none; color: #d4af5a; font-size: 17px; padding: 9px 0; cursor: pointer; }
  .card .ctl button + button { border-left: 1px solid #1d4a35; }
  .card .ctl button.del { color: #e08a8a; }
  .card.new { border-color: #d4af5a; }
  .card.new .num { background: #d4af5a; color: #0e2a1f; }
  .upload { max-width: 1200px; margin: 0 auto; padding: 6px 14px 12px; text-align: center; }
  .upload label { display: inline-block; background: transparent; color: #d4af5a; border: 1px dashed #d4af5a; font-weight: 700; font-size: 15px; padding: 14px 26px; border-radius: 10px; cursor: pointer; }
  .upload input { display: none; }
  .upload p { font-size: 12px; opacity: .7; margin-top: 8px; }
  .pw { max-width: 560px; margin: 0 auto; padding: 0 14px 26px; text-align: center; }
  .pw input { width: 100%; font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #1d4a35; background: #123526; color: #f3ead3; text-align: center; }
  .pw p { font-size: 12px; opacity: .7; margin-top: 6px; }
  #status { text-align: center; padding: 12px; font-size: 14px; min-height: 44px; }
  #status.ok { color: #9fd6a8; }
  #status.err { color: #e08a8a; }
  footer { text-align: center; padding: 0 16px 30px; font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<header>
  <h1>MANAGE PORTAL PHOTOS</h1>
  <p id="count">Loading...</p>
  <div class="bar">
    <button class="btn" id="publish" disabled>Publish changes</button>
    <button class="btn ghost" id="discard" disabled>Discard</button>
  </div>
</header>
<div id="status"></div>
<div class="grid" id="grid"></div>
<div class="upload">
  <label for="fileInput">+ Add photos</label>
  <input id="fileInput" type="file" accept="image/*" multiple>
  <p>Photos are resized automatically. New photos go to the end &mdash; move them with &#9664; &#9654;. Max 12 per publish.</p>
</div>
<div class="pw">
  <input id="pw" type="password" placeholder="Password" autocomplete="off">
  <p>Enter the password once &mdash; this browser remembers it. Publishing takes a few minutes to go live.</p>
</div>
<footer>Changes go live on the portal a few minutes after publishing.</footer>

<script>
var SUPABASE_URL = 'https://gcdpjmxwinsrrekqzfdb.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjZHBqbXh3aW5zcnJla3F6ZmRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjc4NzQsImV4cCI6MjA4MjcwMzg3NH0.SBDSVFldcPSj-kEkbB8HRoHjAMZiB-OoLHwcbveiiHE';
var photos = [];          // [{src, label, dataUrl?}]
var pendingUploads = [];  // {filename, label, b64, dataUrl}
var pendingDeletes = [];  // filenames present on server
var dirty = false;

function status(msg, cls) {
  var s = document.getElementById('status');
  s.textContent = msg; s.className = cls || '';
}
function markDirty() {
  dirty = true;
  document.getElementById('publish').disabled = false;
  document.getElementById('discard').disabled = false;
  status('You have unpublished changes.', '');
}
function thumbSrc(it) {
  if (it.dataUrl) return it.dataUrl;
  return '/' + it.src;
}
function loadAll() {
  status('Loading photos...', '');
  fetch('photos.json').then(function(r){ return r.json(); }).then(function(items){
    photos = items; pendingUploads = []; pendingDeletes = []; dirty = false;
    render(); status('', '');
  }).catch(function(){
    status('Could not load photos. Check your connection and refresh.', 'err');
  });
}
function render() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('count').textContent = photos.length + ' photos \u2014 tap \u25C0 \u25B6 to reorder, \u2715 to delete';
  photos.forEach(function(it, i){
    var card = document.createElement('div');
    card.className = 'card' + (it.dataUrl ? ' new' : '');
    var im = document.createElement('img');
    im.loading = 'lazy'; im.src = thumbSrc(it); im.alt = it.label || '';
    var n = document.createElement('span');
    n.className = 'num'; n.textContent = i + 1;
    var ctl = document.createElement('div');
    ctl.className = 'ctl';
    var bl = document.createElement('button'); bl.innerHTML = '&#9664;'; bl.setAttribute('aria-label', 'Move left');
    bl.onclick = function(){ move(i, -1); };
    var br = document.createElement('button'); br.innerHTML = '&#9654;'; br.setAttribute('aria-label', 'Move right');
    br.onclick = function(){ move(i, 1); };
    var del = document.createElement('button'); del.innerHTML = '&#10005;'; del.className = 'del'; del.setAttribute('aria-label', 'Delete');
    del.onclick = function(){ removeAt(i); };
    ctl.appendChild(bl); ctl.appendChild(br); ctl.appendChild(del);
    card.appendChild(im); card.appendChild(n); card.appendChild(ctl);
    grid.appendChild(card);
  });
}
function move(i, d) {
  var j = i + d;
  if (j < 0 || j >= photos.length) return;
  var t = photos[i]; photos[i] = photos[j]; photos[j] = t;
  render(); markDirty();
}
function removeAt(i) {
  var it = photos[i];
  var name = (it.src || '').split('/').pop();
  if (!confirm('Delete this photo from the portal?\n\n' + (it.label || name))) return;
  photos.splice(i, 1);
  var up = -1;
  pendingUploads.forEach(function(u, k){ if (u.filename === name) up = k; });
  if (up >= 0) pendingUploads.splice(up, 1);
  else pendingDeletes.push(name);
  render(); markDirty();
}
function sanitize(name) {
  return name.toLowerCase().replace(/\.[a-z0-9]+$/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'photo';
}
document.getElementById('fileInput').addEventListener('change', function(e){
  var files = Array.prototype.slice.call(e.target.files || []).slice(0, 12);
  if (!files.length) return;
  status('Preparing ' + files.length + ' photo(s)...', '');
  var done = 0;
  files.forEach(function(f){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 1600, w = img.width, h = img.height;
        if (Math.max(w, h) > max) { var s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = cv.toDataURL('image/jpeg', 0.85);
        var filename = 'portal-' + Date.now() + '-' + Math.floor(Math.random() * 1e4) + '-' + sanitize(f.name) + '.jpg';
        var label = sanitize(f.name).replace(/-/g, ' ');
        pendingUploads.push({ filename: filename, label: label, b64: dataUrl.split(',')[1], dataUrl: dataUrl });
        photos.push({ src: 'review/' + filename, label: label, dataUrl: dataUrl });
        if (++done === files.length) { render(); markDirty(); status('', ''); }
      };
      img.onerror = function(){ if (++done === files.length) { render(); markDirty(); } };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
  e.target.value = '';
});
var pwInput = document.getElementById('pw');
pwInput.value = localStorage.getItem('llw_pw') || '';
pwInput.addEventListener('change', function(){ localStorage.setItem('llw_pw', pwInput.value); });

document.getElementById('publish').addEventListener('click', function(){
  if (!dirty) return;
  var pw = pwInput.value.trim();
  if (!pw) { alert('Enter the password first.'); pwInput.focus(); return; }
  localStorage.setItem('llw_pw', pw);
  if (!confirm('Publish these changes to the live portal?\n\n' + photos.length + ' photos total, ' + pendingUploads.length + ' new, ' + pendingDeletes.length + ' deleted.\n\nIt takes a few minutes to go live.')) return;
  var btn = document.getElementById('publish');
  btn.disabled = true;
  status('Sending to the publisher...', '');
  var payload = {
    password: pw,
    photos: photos.map(function(p){ return { src: p.src, label: p.label }; }),
    uploads: pendingUploads.map(function(u){ return { filename: u.filename, label: u.label, b64: u.b64 }; }),
    deletes: pendingDeletes
  };
  fetch(SUPABASE_URL + '/rest/v1/lowery_portal_requests', {
    method: 'POST',
    headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ payload: payload })
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    status('Sent! The portal updates in a few minutes. You can close this page.', 'ok');
    document.getElementById('discard').disabled = true;
    dirty = false;
  }).catch(function(e){
    status('Could not send: ' + e.message, 'err');
    btn.disabled = false;
  });
});
document.getElementById('discard').addEventListener('click', function(){
  if (!dirty || confirm('Discard all unpublished changes?')) loadAll();
});
loadAll();
</script>
</body>
</html>
