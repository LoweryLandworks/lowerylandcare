<style>

  header { padding: 22px 16px 10px; text-align: center; }
  header h1 { font-size: 22px; letter-spacing: 1px; color: #d4af5a; }
  header p { margin-top: 6px; font-size: 14px; opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 14px; max-width: 1200px; margin: 0 auto; }
  .grid button { border: 2px solid #1d4a35; background: #123526; padding: 0; cursor: pointer; border-radius: 6px; overflow: hidden; aspect-ratio: 1; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 50; align-items: center; justify-content: center; flex-direction: column; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100vw; max-height: 88vh; object-fit: contain; }
  #cap { margin-top: 10px; font-size: 14px; color: #d4af5a; text-align: center; padding: 0 16px; }
  #count { font-size: 12px; opacity: .7; margin-top: 4px; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(212,175,90,.15); border: 1px solid #d4af5a; color: #d4af5a; font-size: 28px; width: 48px; height: 64px; cursor: pointer; border-radius: 8px; }
  #prev { left: 8px; } #next { right: 8px; }
  #close { position: absolute; top: 10px; right: 12px; background: none; border: 1px solid #d4af5a; color: #d4af5a; font-size: 18px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
</style>
</head>
<body>

  <button class="nav" id="prev" aria-label="Previous">&#8249;</button>
  <img id="big" alt="">
  <button class="nav" id="next" aria-label="Next">&#8250;</button>
  <div id="cap"></div>
  <div id="count"></div>
</div>
<script>

var grid = document.getElementById('grid');
ITEMS.forEach(function(it, i) {
  var b = document.createElement('button');
  var im = document.createElement('img');
  im.loading = 'lazy'; im.src = it.src; im.alt = it.label;
  b.appendChild(im);
  b.addEventListener('click', function(){ openLb(i); });
  grid.appendChild(b);
});
var lb = document.getElementById('lightbox'), big = document.getElementById('big'),
    cap = document.getElementById('cap'), count = document.getElementById('count'), cur = 0;
function openLb(i) { cur = (i + ITEMS.length) % ITEMS.length; show(); lb.classList.add('open'); }
function show() { big.src = ITEMS[cur].src; cap.textContent = ITEMS[cur].label; count.textContent = (cur+1) + ' / ' + ITEMS.length; }
function closeLb() { lb.classList.remove('open'); big.src = ''; }
document.getElementById('close').addEventListener('click', closeLb);
document.getElementById('prev').addEventListener('click', function(e){ e.stopPropagation(); openLb(cur-1); });
document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); openLb(cur+1); });
lb.addEventListener('click', function(e){ if (e.target === lb) closeLb(); });
document.addEventListener('keydown', function(e){
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') openLb(cur-1);
  if (e.key === 'ArrowRight') openLb(cur+1);
});
var tx = 0;
lb.addEventListener('touchstart', function(e){ tx = e.changedTouches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) openLb(cur + (dx < 0 ? 1 : -1));
}, {passive:true});
</script>
